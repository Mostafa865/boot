<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10959746' data-sdk='show_10959746'></script>
    <style>
        body { background: #1a1a2e; color: white; text-align: center; padding: 20px; }
        .btn { background: #f4a033; padding: 15px 30px; border: none; border-radius: 12px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🎁 بونص يومي</h2>
    <button class="btn" onclick="startAd()">📺 شاهد الإعلان واستلم 300 نقطة</button>
    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        async function startAd() {
            const btn = document.querySelector('.btn');
            btn.disabled = true;
            try {
                await show_10959746('pop');
                tg.sendData('bonus_ad_watched');
                setTimeout(() => { tg.close(); }, 500);
            } catch(e) {
                alert("حدث خطأ، حاول مرة أخرى");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
