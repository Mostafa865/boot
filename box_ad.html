<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>صندوق الحظ – شاهد الإعلان</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
            padding: 16px;
        }
        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 32px;
            padding: 24px 20px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
        }
        h2 {
            color: #1e3c72;
            font-size: 28px;
            margin-bottom: 12px;
        }
        .desc {
            color: #2c3e66;
            font-size: 16px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .reward-area {
            background: #f0f4ff;
            border-radius: 24px;
            padding: 20px;
            margin: 16px 0;
        }
        .reward-text {
            font-size: 22px;
            font-weight: bold;
            color: #ff8c00;
        }
        button {
            background: #ff8c00;
            border: none;
            border-radius: 60px;
            padding: 16px 20px;
            width: 100%;
            font-size: 20px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin-top: 16px;
            box-shadow: 0 8px 0 #b95f00;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 4px 0 #b95f00;
        }
        .footnote {
            font-size: 12px;
            color: #888;
            margin-top: 24px;
        }
        #status {
            margin-top: 16px;
            font-size: 14px;
            color: #d32f2f;
        }
    </style>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <!-- Monetag SDK (استبدل data-zone بمعرف منطقتك) -->
    <script src="https://libtl.com/sdk.js" data-zone="10959746"></script>
</head>
<body>
<div class="container">
    <h2>🎁 صندوق الحظ</h2>
    <div class="desc">شاهد الإعلان مرة واحدة لفتح الصندوق والحصول على نقاط إضافية</div>
    <div class="reward-area">
        <div>🎲 ستحصل على</div>
        <div class="reward-text">نقاط عادية × 50~2000</div>
        <div style="font-size:13px; margin-top:8px;">حسب مستوى صندوقك و streak اليومي</div>
    </div>
    <button id="watchBtn">📺 مشاهدة الإعلان الآن</button>
    <div class="footnote">بعد مشاهدة الإعلان سيتم إضافة النقاط تلقائياً</div>
    <div id="status"></div>
</div>

<script>
    let telegram = window.Telegram.WebApp;
    telegram.expand();  // توسيع الويب آب لكامل الشاشة
    telegram.ready();
    document.getElementById('watchBtn').addEventListener('click', function() {
        document.getElementById('status').innerText = '⏳ جاري تحميل الإعلان...';
        // هنا كود عرض إعلان Monetag – المكتبة تدير ذلك تلقائياً عند استدعاء الدالة المناسبة
        // نستخدم monetag.showRewardedAd() بحسب توثيق Monetag
        if (typeof monetag !== 'undefined' && monetag.showRewardedAd) {
            monetag.showRewardedAd({
                onRewarded: function() {
                    // المستخدم أكمل مشاهدة الإعلان بالكامل
                    telegram.sendData('box_ad_watched');
                    setTimeout(function() {
                        telegram.close();
                    }, 500);
                },
                onClose: function() {
                    document.getElementById('status').innerText = '⚠️ لم تشاهد الإعلان بالكامل، حاول مرة أخرى.';
                }
            });
        } else {
            // بديل مباشر: إرسال إشارة فورية (للتجربة)
            console.warn("Monetag SDK not ready");
            telegram.sendData('box_ad_watched');
            setTimeout(function() { telegram.close(); }, 500);
        }
    });
</script>
</body>
</html>
