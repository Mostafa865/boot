<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10959746' data-sdk='show_10959746'></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: Arial; text-align: center; padding: 20px; }
        .btn { background: #f4a033; padding: 15px 30px; border-radius: 12px; border: none; color: white; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>📺 شاهد الإعلان واكسب نقاط</h2>
    <button class="btn" id="watchBtn" onclick="watchAd()">▶️ شاهد الإعلان الآن</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function watchAd() {
            const btn = document.getElementById('watchBtn');
            btn.disabled = true;
            btn.innerText = '⏳ جاري تحميل الإعلان...';

            // استدعاء إعلان Monetag (data-zone=10959746)
            show_10959746('pop').then(() => {
                // بعد مشاهدة الإعلان نرسل إشارة للبوت
                tg.sendData('ad_watched');
                tg.close();
            }).catch((err) => {
                console.error(err);
                alert('حدث خطأ، حاول مرة أخرى');
                btn.disabled = false;
                btn.innerText = '▶️ شاهد الإعلان';
            });
        }
    </script>
</body>
</html>
