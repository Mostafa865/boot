<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10959746' data-sdk='show_10959746'></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: Arial; text-align: center; padding: 20px; }
        .btn { background: #6c3df4; padding: 15px 30px; border-radius: 12px; border: none; font-size: 18px; cursor: pointer; color: white; width: 100%; max-width: 300px; margin-top: 20px; }
        .btn:disabled { background: #444; cursor: not-allowed; }
        #status { margin-top: 20px; font-size: 16px; color: #a78bfa; }
    </style>
</head>
<body>
    <h2>📺 شاهد الإعلان واكسب نقاط!</h2>
    <p>اضغط الزر عشان يظهر الإعلان</p>
    <button class="btn" id="watchBtn" onclick="watchAd()">🎬 تشغيل الإعلان</button>
    <div id="status"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        let clicked = false;

        async function watchAd() {
            const btn = document.getElementById('watchBtn');
            const statusDiv = document.getElementById('status');
            btn.disabled = true;
            statusDiv.innerText = "⏳ جاري تحميل الإعلان...";

            try {
                await show_10959746();
                statusDiv.innerText = "✅ تم مشاهدة الإعلان!";
                tg.MainButton.setText("🎁 استلام النقاط");
                tg.MainButton.show();
                tg.MainButton.onClick(() => {
                    if (clicked) return;
                    clicked = true;
                    tg.sendData('ad_watched');
                    tg.MainButton.setText("✅ تم!");
                    tg.MainButton.hide();
                    setTimeout(() => tg.close(), 300);
                });
            } catch(e) {
                statusDiv.innerText = "❌ حاول مجدداً.";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
