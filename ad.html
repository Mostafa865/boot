<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10959746' data-sdk='show_10959746'></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: Arial; text-align: center; padding: 20px; }
        .btn { background: #6c3df4; padding: 15px 30px; border-radius: 12px; border: none; font-size: 18px; cursor: pointer; color: white; width: 100%; max-width: 300px; margin-top: 20px; }
        .btn:disabled { background: #444; cursor: not-allowed; }
        #collectBtn { background: #22c55e; }
        #status { margin-top: 20px; font-size: 16px; color: #a78bfa; }
    </style>
</head>
<body>
    <h2>📺 شاهد الإعلان واكسب نقاط!</h2>
    <div id="status">اضغط الزر عشان يظهر الإعلان</div>
    <button class="btn" id="watchBtn" onclick="watchAd()">🎬 تشغيل الإعلان</button>
    <br>
    <button class="btn" id="collectBtn" onclick="collectPoints()" style="margin-top:15px">🎁 استلم النقاط وأغلق</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        let sent = false;

        async function watchAd() {
            const btn = document.getElementById('watchBtn');
            const statusDiv = document.getElementById('status');
            btn.disabled = true;
            statusDiv.innerText = "⏳ جاري تشغيل الإعلان...";
            try {
                show_10959746();
            } catch(e) {}
            statusDiv.innerText = "✅ شاهد الإعلان ثم اضغط استلم النقاط";
        }

        function collectPoints() {
            if (sent) return;
            sent = true;
            document.getElementById('collectBtn').disabled = true;
            document.getElementById('collectBtn').innerText = "✅ تم!";
            tg.sendData('ad_watched');
            setTimeout(() => tg.close(), 500);
        }
    </script>
</body>
</html>
