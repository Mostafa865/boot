<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاهد إعلان واكسب نقاط</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10959746' data-sdk='show_10959746'></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: Arial; text-align: center; padding: 20px; }
        .btn { background: #f4a033; padding: 15px 30px; border-radius: 12px; border: none; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>📺 شاهد الإعلان</h2>
    <p>اضغط الزر لتحصل على نقاطك فوراً (يظهر إعلان بعد ذلك)</p>
    <button class="btn" id="watchBtn">🎁 اضغط لاستلام النقاط ومشاهدة الإعلان</button>
    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const btn = document.getElementById('watchBtn');
        btn.onclick = () => {
            // 1. أولاً نرسل إشارة 'ad_watched' إلى البوت (تمنح النقاط فوراً)
            tg.sendData('ad_watched');
            // 2. نعطي المستخدم رسالة أنه تم إضافة النقاط
            btn.disabled = true;
            btn.innerText = '✅ تم إضافة نقاطك! جاري فتح الإعلان...';
            // 3. بعد نصف ثانية نعرض الإعلان (حتى يشاهد المستخدم شيئاً)
            setTimeout(() => {
                if (typeof show_10959746 === 'function') {
                    show_10959746('pop').catch(e => console.error);
                } else {
                    alert('خطأ في تحميل الإعلان، لكن النقاط أضيفت.');
                }
                // نغلق الويب آب بعد عرض الإعلان بثواني (اختياري)
                setTimeout(() => tg.close(), 8000);
            }, 500);
        };
    </script>
</body>
</html>
