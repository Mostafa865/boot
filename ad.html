<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- استبدل YOUR_BLOCK_ID بالمعرف الذي ستحصل عليه من AdsGram -->
    <script src="https://adsgram.ai/js/adsgram.min.js" data-block-id="YOUR_BLOCK_ID"></script>
    <style> ... </style>
</head>
<body>
    <button onclick="startAd()">📺 شاهد الإعلان</button>
    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        async function startAd() {
            try {
                const result = await window.Adsgram.showRewardedVideo();
                if (result.done) {
                    tg.sendData('ad_watched'); // ✅ عايز تمنح النقاط هنا
                    tg.close();
                }
            } catch (e) { alert("فشل تحميل الإعلان: " + e.message); }
        }
    </script>
</body>
</html>
