<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//whephiwums.com/sdk.js' data-zone='10959746' data-sdk='show_10959746'></script>
</head>
<body style="text-align:center; padding-top:50px;">
    <button onclick="startAd()">📺 شاهد الإعلان المكافأ</button>
    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        async function startAd() {
            try {
                // عرض الإعلان المكافأ (بدون 'pop')
                await show_10959746();
                // بعد إكمال الإعلان بنجاح
                tg.sendData('ad_watched');
                // إغلاق الويب آب بعد إرسال الإشارة
                setTimeout(() => tg.close(), 500);
            } catch (e) {
                alert("فشل تحميل الإعلان: " + e);
            }
        }
    </script>
</body>
</html>
