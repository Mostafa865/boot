<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10959746' data-sdk='show_10959746'></script>
    <style>
        body {
            background: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .btn {
            background: #f4a033;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <button class="btn" id="watchBtn" onclick="watchAd()">▶️ شاهد الإعلان</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function watchAd() {
            const btn = document.getElementById('watchBtn');
            btn.disabled = true;
            btn.innerText = '⏳ جاري التحميل...';

            // استخدام Rewarded Popup (مع 'pop')
            show_10959746('pop').then(() => {
                // المستخدم شاهد الإعلان حتى النهاية
                tg.sendData('ad_watched');
                tg.close();
            }).catch((e) => {
                // حدث خطأ أو تم إغلاق الإعلان قبل اكتماله
                console.error(e);
                alert('حدث خطأ، حاول مرة أخرى');
                btn.disabled = false;
                btn.innerText = '▶️ شاهد الإعلان';
            });
        }
    </script>
</body>
</html>
