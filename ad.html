<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <button onclick="send()">🎁 اضغط لاستلام النقاط (تجريبي)</button>
    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        function send() {
            tg.sendData('ad_watched');
            tg.close();
        }
    </script>
</body>
</html>
