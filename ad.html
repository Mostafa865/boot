<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10959746' data-sdk='show_10959746'></script>
    <style>
        body {
            background: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .btn {
            background: #6c3df4;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }
        #timer { font-size: 24px; margin: 20px; color: #a78bfa; }
        #confirm { display: none; }
    </style>
</head>
<body>
    <h2>📺 شاهد الإعلان واكسب نقاط!</h2>
    <p>سيظهر الإعلان تلقائياً...</p>
    <div id="timer"></div>
    <div id="confirm">
        <p>✅ شكراً على المشاهدة!</p>
        <button class="btn" onclick="confirmWatch()">✅ استلم نقاطك</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let seconds = 30;
        const timer = document.getElementById('timer');
        const confirm = document.getElementById('confirm');

        show_10959746();

        const interval = setInterval(() => {
            seconds--;
            timer.textContent = `⏳ ${seconds} ثانية`;
            if (seconds <= 0) {
                clearInterval(interval);
                timer.textContent = '';
                confirm.style.display = 'block';
            }
        }, 1000);

        function confirmWatch() {
            tg.sendData('ad_watched');
            tg.close();
        }
    </script>
</body>
</html>
