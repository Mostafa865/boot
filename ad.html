<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10959746' data-sdk='show_10959746'></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: Arial; text-align: center; padding: 20px; }
        .btn { background: #6c3df4; padding: 15px 30px; border-radius: 12px; border: none; font-size: 18px; cursor: pointer; color: white; width: 100%; max-width: 300px; margin-top: 20px; }
        .btn:disabled { background: #444; }
        #status { margin-top: 20px; font-size: 16px; color: #a78bfa; }
        #timer { font-size: 24px; color: #f4a033; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <h2>📺 شاهد الإعلان واكسب نقاط!</h2>
    <p>اضغط الزر عشان يظهر الإعلان</p>
    <button class="btn" id="watchBtn" onclick="watchAd()">🎬 تشغيل الإعلان</button>
    <div id="timer"></div>
    <div id="status"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        let adStarted = false;
        let timerInterval = null;

        async function watchAd() {
            const btn = document.getElementById('watchBtn');
            const statusDiv = document.getElementById('status');
            const timerDiv = document.getElementById('timer');
            btn.disabled = true;
            statusDiv.innerText = "⏳ جاري تحميل الإعلان...";

            // تشغيل timer عشان نتأكد إن الإعلان اتشاف
            let seconds = 0;
            adStarted = false;

            // محاولة تشغيل الإعلان
            const adPromise = show_10959746().then(() => {
                adStarted = true;
            }).catch(() => {
                adStarted = false;
            });

            // انتظر ثانية عشان الإعلان يبدأ
            await new Promise(r => setTimeout(r, 1000));

            // لو الإعلان بدأ — شغل التايمر
            timerDiv.style.display = "block";
            timerInterval = setInterval(() => {
                seconds++;
                timerDiv.innerText = `⏳ ${seconds} ثانية`;
            }, 1000);

            // انتظر الإعلان ينتهي
            await adPromise;
            clearInterval(timerInterval);

            // تأكد إن الوقت كافي (5 ثواني على الأقل)
            if (seconds >= 5 || adStarted) {
                timerDiv.style.display = "none";
                statusDiv.innerText = "✅ تم مشاهدة الإعلان!";
                tg.MainButton.setText("🎁 استلام النقاط");
                tg.MainButton.show();
                tg.MainButton.onClick(() => {
                    tg.sendData('ad_watched');
                    tg.MainButton.setText("✅ تم الإرسال");
                    setTimeout(() => tg.close(), 500);
                });
            } else {
                clearInterval(timerInterval);
                timerDiv.style.display = "none";
                statusDiv.innerText = "❌ لم يتم تحميل الإعلان. حاول مجدداً.";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
