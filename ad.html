<body style="text-align:center; padding-top:50px; font-family:sans-serif;">

<h2>📺 شاهد الإعلان وخد نقاط</h2>
<button onclick="watchAd()" style="padding:15px 30px; font-size:18px;">▶️ مشاهدة الإعلان</button>

<script>
function watchAd() {
    show_10959746().then(() => {
        // ✅ لما الإعلان يخلص
        if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.sendData("ad_watched");
            Telegram.WebApp.close();
        } else {
            alert("Ad watched, but not inside Telegram");
        }
    }).catch(() => {
        alert("❌ لازم تكمل الإعلان للنهاية");
    });
}
</script>
