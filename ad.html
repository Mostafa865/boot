<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10959746' data-sdk='show_10959746'></script>
    <style>
        body {
            background: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .btn {
            background: #6c3df4;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            max-width: 300px;
        }
        .btn:disabled { background: #444; cursor: not-allowed; }
        #status { font-size: 18px; margin: 20px; color: #a78bfa; }
    </style>
</head>
<body>
    <h2>📺 شاهد الإعلان واكسب نقاط!</h2>
    <p>اضغط الزر عشان يظهر الإعلان</p>
    <div id="status"></div>
    <button class="btn" id="watchBtn" onclick="watchAd()">▶️ شاهد الإعلان</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.enableClosingConfirmation();

        function watchAd() {
            document.getElementById('watchBtn').disabled = true;
            document.getElementById('status').textContent = '⏳ جاري تحميل الإعلان...';

            show_10959746('pop').then(() => {
                document.getElementById('status').textContent = '✅ شكراً على المشاهدة!';
                document.getElementById('watchBtn').textContent = '✅ استلم نقاطك';
                document.getElementById('watchBtn').disabled = false;
                document.getElementById('watchBtn').onclick = collectPoints;
            }).catch(() => {
                document.getElementById('status').textContent = '❌ حاول تاني';
                document.getElementById('watchBtn').disabled = false;
            });
        }

        function collectPoints() {
            try {
                tg.sendData('ad_watched');
            } catch(e) {
                window.Telegram.WebApp.sendData('ad_watched');
            }
        }
    </script>
</body>
</html>
