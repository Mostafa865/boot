<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10959746' data-sdk='show_10959746'></script>
</head>
<body>
    <button onclick="startAd()">شاهد الإعلان</button>
    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        async function startAd() {
            try {
                await show_10959746();          // مشاهدة الإعلان
                tg.sendData('ad_watched');      // إرسال إشارة للبوت
                setTimeout(() => tg.close(), 500); // إغلاق بعد نصف ثانية
            } catch (e) {
                alert("فشل الإعلان");
            }
        }
    </script>
</body>
</html>
