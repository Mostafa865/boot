<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10959746' data-sdk='show_10959746'></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: Arial; text-align: center; padding: 20px; }
        .btn { background: #f4a033; padding: 15px 30px; border-radius: 12px; border: none; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>📺 شاهد الإعلان</h2>
    <button class="btn" id="watchBtn">🎬 تشغيل الإعلان</button>
    <div id="status"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const btn = document.getElementById('watchBtn');
        const statusDiv = document.getElementById('status');

        btn.onclick = async () => {
            btn.disabled = true;
            statusDiv.innerText = "⏳ جاري تحميل الإعلان...";
            try {
                await show_10959746();   // انتظار انتهاء الإعلان
                statusDiv.innerText = "✅ تم مشاهدة الإعلان! اضغط الزر أدناه.";
                // ظهور زر كبير أسفل الشاشة
                tg.MainButton.setText("🎁 استلام النقاط");
                tg.MainButton.show();
                tg.MainButton.onClick(() => {
                    tg.sendData('ad_watched');
                    tg.MainButton.setText("✅ تم الإرسال");
                    setTimeout(() => tg.close(), 500);
                });
            } catch(e) {
                statusDiv.innerText = "❌ فشل الإعلان. حاول مجدداً.";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
